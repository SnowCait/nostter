name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - nostr-kit/v*
      - nostr-protocol/v*

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-package-${{ startsWith(github.ref_name, 'nostr-kit/') && 'nostr-kit' || 'nostr-protocol' }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Verify the tag and release preparation
        run: node .github/scripts/package-release.mjs inspect
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: node .github/scripts/package-release.mjs validate
      - name: Publish or verify the existing publication
        run: node .github/scripts/package-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Create the package GitHub Release
        run: node .github/scripts/package-release.mjs release
        env:
          GH_TOKEN: ${{ github.token }}
