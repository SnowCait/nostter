name: UI screenshot comparison
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ui-comparison-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.runs.outputs.pr }}
      changed: ${{ steps.result.outputs.changed }}
      artifact: ${{ steps.upload.outputs.artifact-url }}
    steps:
      # Only trusted default-branch code runs here, never the PR ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - run: npm ci
      - name: Download existing screenshots
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail

          head=$(jq -r '
            .workflow_run | "\(.head_repository.owner.login):\(.head_branch)"
          ' "$GITHUB_EVENT_PATH")
          pr=$(
            gh api "repos/$GH_REPO/pulls" --method GET --paginate \
              -f state=open -f head="$head" -f per_page=100 |
            jq -s --slurpfile event "$GITHUB_EVENT_PATH" '
              $event[0].workflow_run as $run |
              add |
              map(select(.head.sha == $run.head_sha and .head.repo.id == $run.head_repository.id)) |
              first.number // error("No current PR for this Test run")
            '
          )

          baseline=$(
            gh run list --workflow test.yml --branch main \
              --event push --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // error("No successful main baseline")'
          )
          current=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
          gh run download "$baseline" --name ui-screenshots --dir web/test-results/ui-baseline
          gh run download "$current" --name ui-screenshots --dir web/test-results/ui-current

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - name: Compare saved PNGs with Playwright
        continue-on-error: true
        working-directory: web
        run: npx playwright test --config=playwright.compare.config.ts
      - id: result
        name: Read Playwright result
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('web/test-results/ui-report.json','utf8'));
          if(report.errors.length || report.stats.expected + report.stats.unexpected === 0) throw new Error('Comparison unavailable');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${report.stats.unexpected > 0}\n`);
          JS
      - id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshot-comparison
          path: |
            web/test-results/ui-report/
            web/test-results/ui-baseline/
            web/test-results/ui-current/
  notify:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.compare.outputs.pr }}
        run: |
          set -o pipefail

          head=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
          current_head=$(
            gh api "repos/$GH_REPO/pulls/$PR" \
              --jq 'select(.state == "open") | .head.sha'
          )
          if [ "$current_head" != "$head" ]; then
            exit 0
          fi

          has_newer_run=$(
            gh api "repos/$GH_REPO/actions/workflows/test.yml/runs" --method GET --paginate \
              -f event=pull_request -f head_sha="$head" -f per_page=100 |
            jq -s --slurpfile event "$GITHUB_EVENT_PATH" '
              $event[0].workflow_run as $run |
              any(.[].workflow_runs[];
                .id > $run.id or
                (.id == $run.id and .run_attempt > $run.run_attempt)
              )
            '
          )
          if [ "$has_newer_run" = true ]; then
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.current.outputs.current == 'true'
        with:
          header: nostter-playwright-ui-comparison
          number_force: ${{ needs.compare.outputs.pr }}
          delete: ${{ needs.compare.outputs.changed == 'false' }}
          message: |
            UI screenshot differences detected.

            [Download the Playwright report and images](${{ needs.compare.outputs.artifact }}) (open ui-report/index.html).
