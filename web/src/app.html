<!doctype html>
<html lang="%lang%" data-git-sha="%git-sha%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f9f5f1" />
		<script>
			// Register before the SvelteKit head so stylesheet failures can be observed before app modules load.
			(() => {
				const maxStylesheets = 32;
				const maxJavascriptResources = 16;
				const sentTypes = new Set();
				// Read once so the build that rendered this document is kept across SPA navigations.
				const gitSha = document.documentElement.dataset.gitSha;

				const toSameOriginPath = (href) => {
					try {
						const url = new URL(href, location.href);
						return url.origin === location.origin ? url.pathname : undefined;
					} catch {
						return undefined;
					}
				};

				const redactPathname = (pathname) =>
					pathname
						.split('/')
						.map((segment) => {
							if (
								segment === '' ||
								/^[a-z]{1,32}$/.test(segment) ||
								/^\d{1,4}$/.test(segment)
							) {
								return segment;
							}
							const entity = /^(?:nostr%3a)?(npub|nprofile|note|nevent|naddr)1/i.exec(
								segment
							);
							return entity === null ? '[param]' : `[${entity[1].toLowerCase()}]`;
						})
						.join('/');

				// Resource Timing entries or responseStatus may be unavailable depending on the browser.
				const responseStatusOf = (href) => {
					try {
						const entries = performance
							.getEntriesByName(href, 'resource')
							.filter(({ initiatorType }) => initiatorType === 'link');
						const entry = entries[entries.length - 1];
						return typeof entry?.responseStatus === 'number'
							? entry.responseStatus
							: null;
					} catch {
						return null;
					}
				};

				// Snapshots already buffered entries to tell whether JavaScript assets failed alongside stylesheets.
				// Selected by path because preloaded modules have an initiatorType other than script.
				// Scans from the newest entry to keep the assets loaded closest to the failure.
				const javascriptResources = () => {
					try {
						const entries = performance.getEntriesByType('resource');
						const resources = new Map();
						for (
							let i = entries.length - 1;
							i >= 0 && resources.size < maxJavascriptResources;
							i--
						) {
							const entry = entries[i];
							const path = toSameOriginPath(entry.name);
							if (
								path?.startsWith('/_app/immutable/') &&
								path.endsWith('.js') &&
								!resources.has(path)
							) {
								resources.set(path, {
									path,
									initiatorType: entry.initiatorType,
									responseStatus:
										typeof entry.responseStatus === 'number'
											? entry.responseStatus
											: null
								});
							}
						}
						return [...resources.values()].reverse();
					} catch {
						return [];
					}
				};

				const send = (type, stylesheetPath) => {
					if (sentTypes.has(type)) {
						return;
					}
					sentTypes.add(type);

					try {
						const stylesheets = [
							...document.querySelectorAll('link[rel~="stylesheet"]')
						]
							.map((link) => ({
								path: toSameOriginPath(link.href),
								href: link.href,
								sheet: link.sheet
							}))
							.filter(({ path }) => path !== undefined)
							.slice(0, maxStylesheets);
						fetch('/api/diagnostics/client', {
							method: 'POST',
							keepalive: true,
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({
								type,
								pathname: redactPathname(location.pathname),
								stylesheetPath,
								stylesheetPaths: stylesheets.map(({ path }) => path),
								stylesheetResponseStatuses: stylesheets.map(({ href }) =>
									responseStatusOf(href)
								),
								unavailableStylesheetPaths: stylesheets
									.filter(({ sheet }) => sheet === null)
									.map(({ path }) => path),
								javascriptResources: javascriptResources(),
								timestamp: Date.now(),
								standalone:
									matchMedia('(display-mode: standalone)').matches ||
									navigator.standalone === true,
								serviceWorkerControlled: Boolean(
									navigator.serviceWorker?.controller
								),
								// Omitted when the build has no commit SHA, which the server logs as unknown.
								...(gitSha ? { gitSha } : {})
							})
						}).catch(() => {});
					} catch {
						// Best-effort diagnostics must not affect app startup.
					}
				};

				addEventListener(
					'error',
					(event) => {
						const target = event.target;
						if (
							target instanceof HTMLLinkElement &&
							target.relList.contains('stylesheet')
						) {
							const path = toSameOriginPath(target.href);
							if (path !== undefined) {
								send('stylesheet-load-error', path);
							}
						}
					},
					true
				);

				addEventListener(
					'load',
					() => {
						const background = getComputedStyle(document.documentElement)
							.getPropertyValue('--background')
							.trim();
						if (background === '') {
							send('stylesheet-not-applied');
						}
					},
					{ once: true }
				);
			})();
		</script>
		%sveltekit.head%
		<script>
			(() => {
				const theme = localStorage.getItem('nostter:theme') ?? 'system';
				if (
					theme === 'dark' ||
					(theme === 'system' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}

				const color = getComputedStyle(document.documentElement).getPropertyValue(
					'--background'
				);
				const themeColorMetaTag = document.querySelector('meta[name="theme-color"]');
				if (themeColorMetaTag !== null) {
					themeColorMetaTag.content = color;
				}

				// App modules cannot be imported here, so this mirrors contentFontSizes.
				const contentFontSize = localStorage.getItem(
					'nostter:preference:content-font-size'
				);
				if (['small', 'default', 'large', 'extra-large'].includes(contentFontSize)) {
					document.documentElement.dataset.contentFontSize = contentFontSize;
				}
			})();
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
