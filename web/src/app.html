<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f9f5f1" />
		<script>
			// Register before the SvelteKit head so stylesheet failures can be observed before app modules load.
			(() => {
				const maxStylesheets = 32;
				const sentTypes = new Set();

				const toSameOriginPath = (href) => {
					try {
						const url = new URL(href, location.href);
						return url.origin === location.origin ? url.pathname : undefined;
					} catch {
						return undefined;
					}
				};

				const redactPathname = (pathname) =>
					pathname
						.split('/')
						.map((segment) => {
							if (
								segment === '' ||
								/^[a-z]{1,32}$/.test(segment) ||
								/^\d{1,4}$/.test(segment)
							) {
								return segment;
							}
							const entity = /^(?:nostr%3a)?(npub|nprofile|note|nevent|naddr)1/i.exec(
								segment
							);
							return entity === null ? '[param]' : `[${entity[1].toLowerCase()}]`;
						})
						.join('/');

				// Resource Timing entries and their properties may be unavailable depending on the browser.
				const resourceTimingOf = (href) => {
					try {
						const entries = performance
							.getEntriesByName(href, 'resource')
							.filter(({ initiatorType }) => initiatorType === 'link');
						return entries[entries.length - 1];
					} catch {
						return undefined;
					}
				};

				const numberOrNull = (value) => (typeof value === 'number' ? value : null);
				const stringOrNull = (value) => (typeof value === 'string' ? value : null);

				const timingSnapshotOf = ({ path, resourceTiming: entry }) => ({
					path,
					fetchStart: numberOrNull(entry?.fetchStart),
					domainLookupStart: numberOrNull(entry?.domainLookupStart),
					domainLookupEnd: numberOrNull(entry?.domainLookupEnd),
					connectStart: numberOrNull(entry?.connectStart),
					secureConnectionStart: numberOrNull(entry?.secureConnectionStart),
					connectEnd: numberOrNull(entry?.connectEnd),
					requestStart: numberOrNull(entry?.requestStart),
					responseStart: numberOrNull(entry?.responseStart),
					responseEnd: numberOrNull(entry?.responseEnd),
					nextHopProtocol: stringOrNull(entry?.nextHopProtocol),
					deliveryType: stringOrNull(entry?.deliveryType),
					transferSize: numberOrNull(entry?.transferSize),
					encodedBodySize: numberOrNull(entry?.encodedBodySize)
				});

				const send = (type, stylesheetPath) => {
					if (sentTypes.has(type)) {
						return;
					}
					sentTypes.add(type);

					try {
						const allStylesheets = [
							...document.querySelectorAll('link[rel~="stylesheet"]')
						]
							.map((link) => ({
								path: toSameOriginPath(link.href),
								href: link.href,
								sheet: link.sheet
							}))
							.filter(({ path }) => path !== undefined)
							.map((stylesheet) => ({
								...stylesheet,
								resourceTiming: resourceTimingOf(stylesheet.href)
							}));
						const stylesheets = allStylesheets.slice(0, maxStylesheets);
						const representativeStylesheet =
							allStylesheets.find(({ path }) => path === stylesheetPath) ??
							allStylesheets.find(({ sheet }) => sheet === null) ??
							allStylesheets[0];
						fetch('/api/diagnostics/client', {
							method: 'POST',
							keepalive: true,
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({
								type,
								pathname: redactPathname(location.pathname),
								stylesheetPath,
								stylesheetPaths: stylesheets.map(({ path }) => path),
								stylesheetResponseStatuses: stylesheets.map(({ resourceTiming }) =>
									numberOrNull(resourceTiming?.responseStatus)
								),
								unavailableStylesheetPaths: stylesheets
									.filter(({ sheet }) => sheet === null)
									.map(({ path }) => path),
								stylesheetTiming:
									representativeStylesheet &&
									timingSnapshotOf(representativeStylesheet),
								timestamp: Date.now(),
								standalone:
									matchMedia('(display-mode: standalone)').matches ||
									navigator.standalone === true,
								serviceWorkerControlled: Boolean(
									navigator.serviceWorker?.controller
								)
							})
						}).catch(() => {});
					} catch {
						// Best-effort diagnostics must not affect app startup.
					}
				};

				addEventListener(
					'error',
					(event) => {
						const target = event.target;
						if (
							target instanceof HTMLLinkElement &&
							target.relList.contains('stylesheet')
						) {
							const path = toSameOriginPath(target.href);
							if (path !== undefined) {
								send('stylesheet-load-error', path);
							}
						}
					},
					true
				);

				addEventListener(
					'load',
					() => {
						const background = getComputedStyle(document.documentElement)
							.getPropertyValue('--background')
							.trim();
						if (background === '') {
							send('stylesheet-not-applied');
						}
					},
					{ once: true }
				);
			})();
		</script>
		%sveltekit.head%
		<script>
			(() => {
				const theme = localStorage.getItem('nostter:theme') ?? 'system';
				if (
					theme === 'dark' ||
					(theme === 'system' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}

				const color = getComputedStyle(document.documentElement).getPropertyValue(
					'--background'
				);
				const themeColorMetaTag = document.querySelector('meta[name="theme-color"]');
				if (themeColorMetaTag !== null) {
					themeColorMetaTag.content = color;
				}

				// App modules cannot be imported here, so this mirrors contentFontSizes.
				const contentFontSize = localStorage.getItem(
					'nostter:preference:content-font-size'
				);
				if (['small', 'default', 'large', 'extra-large'].includes(contentFontSize)) {
					document.documentElement.dataset.contentFontSize = contentFontSize;
				}
			})();
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
